name: golden_lens
description: >-
  Agent-grade golden tests for Flutter: attribute visual diffs to the exact
  widget and source line, score perceptual parity, and emit agent-readable
  reports.
version: 0.2.0
repository: https://github.com/Umer9538/golden_lens
issue_tracker: https://github.com/Umer9538/golden_lens/issues

topics:
  - testing
  - golden
  - visual-regression
  - ai

screenshots:
  - description: >-
      golden_lens highlights the changed region and names the offending
      widget + source line.
    path: doc/diff.png

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
